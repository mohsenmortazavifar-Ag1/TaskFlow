name: Web Build

on:
  push:
    branches: [main, feature/outbox-dispatcher]
    paths: ["src/**", "package.json", "package-lock.json", "tsconfig.json", "next.config.ts", ".github/workflows/web-build.yml"]
  pull_request:
    paths: ["src/**", "package.json", "package-lock.json", "tsconfig.json", "next.config.ts", ".github/workflows/web-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
